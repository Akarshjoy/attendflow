<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#618477"/></marker></defs><rect width="1200" height="920" fill="#f4f7f2"/><style>text{font-family:Arial,sans-serif;fill:#173b35}.label{font-size:19px;font-weight:bold}.detail{font-size:14px;fill:#58766a}.edge{stroke:#618477;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="48" y="54" font-size="28" font-weight="bold">AttendFlow — architecture &amp; trust boundaries</text><text x="48" y="85" class="detail">Single region · private S3 · Cognito-protected API · no custom model training</text><rect x="48" y="130" width="300" height="115" rx="13" fill="#ffffff" stroke="#c9d9ce"/><text x="66" y="160" class="label">Browser + CloudFront</text><text x="66" y="187" class="detail">Admin / trusted Kiosk</text><text x="66" y="208" class="detail">HTTPS camera and direct upload</text><rect x="450" y="130" width="300" height="115" rx="13" fill="#ffffff" stroke="#c9d9ce"/><text x="468" y="160" class="label">Cognito + API Gateway</text><text x="468" y="187" class="detail">ID token authentication</text><text x="468" y="208" class="detail">API Lambda: roles + session policy</text><rect x="850" y="130" width="300" height="115" rx="13" fill="#ffffff" stroke="#c9d9ce"/><text x="868" y="160" class="label">DynamoDB</text><text x="868" y="187" class="detail">Employees · Sessions · Config</text><text x="868" y="208" class="detail">Attendance · Audit</text><path class="edge" d="M348 183 H450"/><path class="edge" d="M750 183 H850"/><rect x="48" y="330" width="300" height="115" rx="13" fill="#ffffff" stroke="#c9d9ce"/><text x="66" y="360" class="label">Private S3 capture bucket</text><text x="66" y="387" class="detail">Presigned POST · JPEG / PNG</text><text x="66" y="408" class="detail">Exact version · 3 MB maximum</text><rect x="450" y="330" width="300" height="115" rx="13" fill="#ffffff" stroke="#c9d9ce"/><text x="468" y="360" class="label">SQS → Recognition Lambda</text><text x="468" y="387" class="detail">Session lease + single-face gate</text><text x="468" y="408" class="detail">Idempotent attendance transaction</text><rect x="850" y="330" width="300" height="115" rx="13" fill="#ffffff" stroke="#c9d9ce"/><text x="868" y="360" class="label">Rekognition collection</text><text x="868" y="387" class="detail">DetectFaces → SearchFacesByImage</text><text x="868" y="408" class="detail">IndexFaces for enrollment</text><path class="edge" d="M198 245 V330"/><path class="edge" d="M348 387 H450"/><path class="edge" d="M750 387 H850"/><path class="edge" d="M670 330 V280 H1000 V245"/><rect x="450" y="510" width="300" height="95" rx="13" fill="#f7e9e5" stroke="#c9d9ce"/><text x="468" y="540" class="label">SQS dead-letter queue</text><text x="468" y="567" class="detail">Exhausted processing / report failures</text><path class="edge" d="M600 445 V510"/><rect x="48" y="665" width="300" height="115" rx="13" fill="#ffffff" stroke="#c9d9ce"/><text x="66" y="695" class="label">EventBridge / Scheduler</text><text x="66" y="722" class="detail">Cleanup: every 5 minutes</text><text x="66" y="743" class="detail">Reports: business timezone cron</text><rect x="450" y="665" width="300" height="115" rx="13" fill="#ffffff" stroke="#c9d9ce"/><text x="468" y="695" class="label">Cleanup + Report Lambdas</text><text x="468" y="722" class="detail">Delete raw image versions</text><text x="468" y="743" class="detail">Daily close and weekly aggregation</text><rect x="850" y="665" width="300" height="115" rx="13" fill="#ffffff" stroke="#c9d9ce"/><text x="868" y="695" class="label">Private S3 report bucket</text><text x="868" y="722" class="detail">Daily and weekly JSON summaries</text><text x="868" y="743" class="detail">Versioned · admin download links</text><path class="edge" d="M348 722 H450"/><path class="edge" d="M750 722 H850"/><path class="edge" d="M480 665 H390 V420 H348"/><path class="edge" d="M1150 200 H1180 V625 H680 V665"/><rect x="48" y="824" width="1102" height="60" rx="10" fill="#e5eddf"/><text x="68" y="850" class="detail">CloudWatch logs + alarms → SNS admin alerts. IAM scopes each function to its required resources/actions.</text><text x="68" y="872" class="detail">Photos: explicit deletion + scheduled cleanup. Face vectors persist until removal. Still-image matching is not liveness.</text></svg>